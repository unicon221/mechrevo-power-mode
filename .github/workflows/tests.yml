name: tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.11", "3.12", "3.13" ]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查
        run: |
          python -m py_compile mechrevo-keyd.py
          python -m py_compile tests/selftest.py tests/ec_sim_test.py tests/integration_test.py

      - name: 守护进程自测
        run: python tests/selftest.py

      - name: 指示灯写 EC 端到端模拟
        run: python tests/ec_sim_test.py

      - name: 主循环集成测试
        run: python tests/integration_test.py

      - name: shell 语法检查
        run: |
          bash -n install.sh
          bash -n tools/diag-acpi.sh
          bash -n tools/cycle-power-profile.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        # ubuntu-latest 自带 shellcheck，无需安装。
        # 只把 error 级别当失败；已核实三个脚本在 error 与 warning 级别均为 0 问题。
        run: shellcheck --severity=error install.sh tools/*.sh
      - name: 确认仓库里没有构建产物 / 本机固件转储
        run: |
          if git ls-files | grep -qE '(__pycache__|\.pyc$|dsdt\.(dsl|aml)$)'; then
            echo "::error::仓库里不应包含构建产物或本机固件转储"
            git ls-files | grep -E '(__pycache__|\.pyc$|dsdt\.)'
            exit 1
          fi
          echo "OK: 无构建产物 / 固件转储"
