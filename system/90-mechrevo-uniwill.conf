# MECHREVO 翼龙15Pro / GM5HG0A (TongFang 同方准系统)
# 让内核 uniwill_laptop 驱动在 MECHREVO 贴牌机上加载。
#
# 背景：内核自带的 uniwill_laptop 驱动其 DMI 匹配表只写明了 sys_vendor = "TUXEDO"，
# 而这台机器是同一套同方准系统贴的 MECHREVO 牌，所以 54 条 DMI 别名一条都匹配不上，
# 驱动永远不会自动加载 —— 这也是性能模式按键失效的直接原因。
#
# force=1 表示跳过 DMI 白名单检查，按“支持全部特性（电池充电上限除外）”加载。

options uniwill_laptop force=1

# 防止其它占用同一批 WMI GUID 的驱动抢走热键事件。
# ABBC0F72 被 eeepc_wmi 声明，ABBC0F6E 被 msi_wmi_platform 声明，
# 二者与本机 INOU0000 设备的 GUID 重叠。
blacklist eeepc_wmi
blacklist msi_wmi_platform
